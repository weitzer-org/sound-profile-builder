services:
  app:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Local dev always uses the S3 backend pointed at the MinIO service.
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      PORT: "8080"
      # Controlled by run-mock.sh / run-live.sh; defaults to mock (no key needed).
      MOCK_MODE: "${MOCK_MODE:-true}"
      # Agent trace logs write here too — track the SAME bucket as presets so
      # they persist under logs/ instead of erroring against a nonexistent bucket.
      GCS_BUCKET_NAME: "${S3_BUCKET:-sound-builder-local}"
    depends_on:
      createbuckets:
        condition: service_completed_successfully
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio-data:/data

  # One-shot: wait for MinIO, then create the app's bucket.
  createbuckets:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-sound-builder-local}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${S3_ACCESS_KEY_ID} $${S3_SECRET_ACCESS_KEY}; do
        echo 'waiting for minio...'; sleep 2;
      done;
      mc mb --ignore-existing local/$${S3_BUCKET};
      echo 'Bucket ready: '$${S3_BUCKET};
      exit 0;
      "

volumes:
  minio-data:
