<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login - QC-2 Modeler</title>
    <!-- PWA Manifest & App Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="QC-2 Modeler">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/static/icons/icon-180.png">
    
    <script src="https://unpkg.com/htmx.org@1.9.6"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --text-muted: #64748b;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --border: #334155;
            --success: #10b981;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 3rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .login-card h2 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 0.5rem;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .login-card p {
            color: var(--text-sub);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-sub);
            font-size: 0.95rem;
        }

        input[type="password"] {
            width: 100%;
            padding: 0.85rem 1rem;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            box-sizing: border-box;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        input[type="password"]:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        button {
            width: 100%;
            padding: 1rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }
        
        button.htmx-request {
            opacity: 0.7;
            pointer-events: none;
        }

        /* --- PWA STANDALONE STYLING (Active ONLY when body has .is-standalone class) --- */
        body.is-standalone {
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            box-sizing: border-box;
            
            /* Lock screen rubber-banding */
            position: fixed;
            overflow: hidden;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body.is-standalone * {
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        body.is-standalone input {
            -webkit-user-select: text;
            user-select: text;
        }

        body.is-standalone button:active {
            transform: scale(0.97);
            filter: brightness(0.9);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Authentication Required</h2>
        <p>Enter the secure password to continue.</p>

        <form hx-post="/login" hx-target="#login-error" hx-indicator="#login-btn" hx-disabled-elt="this, #login-btn">
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autofocus autocomplete="current-password">
            </div>

            <button type="submit" id="login-btn">
                Log In
            </button>
            <div id="login-error"></div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const isStandaloneQuery = urlParams.get('mode') === 'standalone';
            const isIOSStandalone = window.navigator.standalone === true;
            const isStandardStandalone = window.matchMedia('(display-mode: standalone)').matches;

            // Persist standalone state in sessionStorage so redirect paths inherit it
            if (isStandaloneQuery || isIOSStandalone || isStandardStandalone) {
                sessionStorage.setItem('pwa-standalone', 'true');
            }

            const isPWA = sessionStorage.getItem('pwa-standalone') === 'true';

            if (isPWA) {
                document.body.classList.add('is-standalone');
                console.log('Login running in Standalone PWA Mode (Session-persisted PWA controls)');

                // Track standalone parameter in HTMX configurations
                document.body.addEventListener('htmx:configRequest', (event) => {
                    let path = event.detail.path;
                    if (!path.includes('mode=standalone')) {
                        path += (path.includes('?') ? '&' : '?') + 'mode=standalone';
                        event.detail.path = path;
                    }
                });
            }
        });
    </script>
</body>
</html>
