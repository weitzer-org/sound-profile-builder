# Fly.io deployment for the QC-2 Sound Builder.
#
# First time:  fly launch --no-deploy   (creates the app; may rename it)
# Deploy:      fly deploy
#
# Secrets are NOT stored in this file — set them with `fly secrets set`:
#   fly secrets set \
#     GEMINI_API_KEY=... \
#     UI_PASSWORD=<your-ui-login-password> \
#     S3_ACCESS_KEY_ID=... \
#     S3_SECRET_ACCESS_KEY=... \
#     S3_ENDPOINT=https://<ACCOUNT_ID>.r2.cloudflarestorage.com \
#     S3_BUCKET=<your-r2-bucket>

app = "sound-profile-builder"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  STORAGE_BACKEND = "s3"
  S3_REGION = "auto"

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero when idle; wake in ~1-2s on the next request.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
