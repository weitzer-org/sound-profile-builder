name: GSR Code Review

# Gemini-powered automated PR review (github.com/weitzer-org/gsr), running
# as a GitHub Action on this repo's own runner -- no diff content leaves
# GitHub/Google. Runs alongside gemini-code-assist/CodeRabbit as another
# free (non-Claude-quota) automated backstop to /quick-review; see
# CLAUDE.md's Code Review section.
#
# Requires a repo secret GSR_GEMINI_API_KEY (Settings -> Secrets and
# variables -> Actions) -- a Gemini API key dedicated to CI review, kept
# separate from the app's own GEMINI_API_KEY (Fly secret) so PR-review
# traffic doesn't share quota/billing with the deployed QC-2 pipeline.
#
# usage-report-url/usage-report-key opt this repo into GSR's centralized
# usage reporting (off by default for every other consumer) -- the shared
# secret was handed to this repo specifically by the GSR maintainer, same
# distribution model as GSR_GEMINI_API_KEY above. Every run also always
# writes its own usage summary to this workflow run's Job Summary
# regardless of these two inputs; see weitzer-org/gsr's ACTION.md.
#
# feedback-loop: respond + feedback-post: true opts this repo into GSR's
# PR-comment feedback loop end to end -- GSR classifies replies to its own
# prior findings and, once adjudicator confidence clears
# feedback-min-confidence (default 0.7), posts a real rebuttal reply in that
# PR thread (capped at feedback-max-replies per run). feedback-report-url/
# feedback-report-key report classification/adjudication outcomes back to
# GSR the same opt-in way usage-report-url/usage-report-key do above, using
# the GSR_FEEDBACK_KEY secret (handed to this repo the same way
# USAGE_REPORT_KEY was).

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: gsr-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: weitzer-org/gsr@main
        with:
          gemini-api-key: ${{ secrets.GSR_GEMINI_API_KEY }}
          mode: basic
          fail-on-severity: none
          usage-report-url: https://gsr-code-review.fly.dev/api/usage/ingest
          usage-report-key: ${{ secrets.USAGE_REPORT_KEY }}
          feedback-loop: respond
          feedback-post: true
          feedback-report-url: https://gsr-code-review.fly.dev/api/findings/feedback
          feedback-report-key: ${{ secrets.GSR_FEEDBACK_KEY }}
