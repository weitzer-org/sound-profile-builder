name: Test

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit + E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      - name: Bring up app + MinIO (mock mode)
        run: |
          cp .env.example .env
          MOCK_MODE=true docker compose up -d --build

      - name: Wait for app to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/login >/dev/null; then
              echo "App is up"
              exit 0
            fi
            sleep 1
          done
          echo "App did not become ready in time"
          docker compose logs
          exit 1

      - name: Run visual + structural specs (need a pristine preset library)
        # Must run before any spec that saves its own presets -- Playwright
        # runs files in alphabetical discovery order regardless of CLI
        # argument order, and the library-list screenshot/assertions are
        # only meaningful against a library the test itself fully controls.
        run: |
          docker run --rm --network host \
            -e BASE_URL=http://localhost:8080 \
            -v "$(pwd)/tests/e2e:/e2e" -w /e2e \
            mcr.microsoft.com/playwright:v1.58.2 \
            sh -c "npm install && npx playwright test --workers=1 --reporter=list \
              visual_mobile.spec.js visual_desktop.spec.js mobile_structure.spec.js"

      - name: Run functional specs
        # Excluded, pre-existing and unrelated to the mobile work:
        #   - real_gemini.spec.js: requires a real GEMINI_API_KEY, takes up to
        #     10 minutes, manual/live-mode use only.
        #   - load_more.spec.js / search.spec.js: assume a preset library
        #     already seeded with a dozen-plus presets (incl. ones named
        #     "Hendrix") from prior manual testing, rather than seeding their
        #     own data. They pass against a long-lived dev bucket but fail
        #     against a fresh one, as CI always is. Needs a proper seeding
        #     step before these can join CI.
        #   - table_use_cases.spec.js: Case 4's page.route mock for
        #     /api/preset/chat isn't reliably intercepting the HTMX request
        #     ahead of the file's own broader /api/preset* mock; needs
        #     investigation independent of mobile work.
        run: |
          docker run --rm --network host \
            -e BASE_URL=http://localhost:8080 \
            -v "$(pwd)/tests/e2e:/e2e" -w /e2e \
            mcr.microsoft.com/playwright:v1.58.2 \
            sh -c "npm install && npx playwright test --workers=1 --reporter=list \
              app.spec.js progress.spec.js scoping.spec.js"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/test-results
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose down -v
